<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mafia Club — Игровая комната</title>
    <link href="https://fonts.googleapis.com/css2?family=Stardos+Stencil:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            min-height: 100vh;
            background: radial-gradient(circle, #1e1e1e 0%, #121212 100%);
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        /* Шапка комнаты */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1e1e1e;
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid #333;
            margin-bottom: 20px;
        }
        .brand-container {
            border: 2px solid #8b0000;
            padding: 5px 12px;
            border-radius: 4px;
            background-color: #140505;
            box-shadow: 0 0 8px rgba(139, 0, 0, 0.4);
        }
        .mafia-title {
            font-family: 'Stardos Stencil', cursive;
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(180deg, #cccccc 40%, #8b0000 85%, #ff0000 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .room-header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn {
            background-color: #2b2b2b;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            font-size: 13px;
        }
        .btn:hover {
            border-color: #e50914;
            background-color: #333;
        }
        .btn-danger {
            background-color: #e50914;
            border-color: #e50914;
        }
        .btn-danger:hover {
            background-color: #b80710;
        }

        /* Информационная панель фазы и таймера */
        .game-status-panel {
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }
        .phase-title {
            font-size: 18px;
            color: #e50914;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .timer-display {
            font-size: 36px;
            font-weight: bold;
            font-family: monospace;
            color: #fff;
        }
        .current-speaker {
            font-size: 14px;
            color: #aaa;
            margin-top: 5px;
        }

        /* Панель управления Создателя */
        .host-panel {
            background-color: #181818;
            border: 1px dashed #e50914;
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .host-badge {
            font-size: 13px;
            color: #e50914;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Сетка строго по 5 карточек в ряд */
        .table-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .player-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 8px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .player-card.active-speaker {
            border-color: #2ed573;
            box-shadow: 0 0 8px rgba(46, 213, 115, 0.3);
        }
        .player-number {
            position: absolute;
            top: 5px;
            left: 5px;
            background-color: #2b2b2b;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            color: #ccc;
        }
        .kick-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: none;
            border: none;
            color: #e50914;
            font-size: 12px;
            cursor: pointer;
            display: none;
        }
        .kick-btn:hover {
            color: #ff4d4d;
        }
        .avatar-placeholder {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #2b2b2b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            margin-top: 6px;
        }
        .player-name {
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            word-break: break-word;
        }
        .player-role {
            font-size: 10px;
            color: #888;
            text-transform: uppercase;
        }

        /* Чат комнаты */
        .chat-panel {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
        }
        .chat-messages {
            height: 120px;
            overflow-y: auto;
            border-bottom: 1px solid #2b2b2b;
            padding-bottom: 10px;
            margin-bottom: 10px;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .chat-msg {
            color: #ccc;
        }
        .chat-msg .author {
            color: #e50914;
            font-weight: bold;
        }
        .chat-msg.system {
            color: #aaa;
            font-style: italic;
        }
        .chat-input-row {
            display: flex;
            gap: 10px;
        }
        .chat-input-row input {
            flex: 1;
            background-color: #2b2b2b;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 12px;
            border-radius: 4px;
        }

        /* Общие стили для подключаемого модального окна */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            width: 90%;
            max-width: 500px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        .modal-title {
            font-size: 16px;
            color: #e50914;
            text-transform: uppercase;
        }
        .close-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 20px;
            cursor: pointer;
        }
        .section-label {
            font-size: 12px;
            color: #e50914;
            font-weight: bold;
            text-transform: uppercase;
            margin: 10px 0 6px 0;
        }
        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .form-row select {
            background-color: #2b2b2b;
            border: 1px solid #444;
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
        }
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .checkbox-group label {
            font-size: 13px;
            color: #ccc;
            display: flex;
            align-items: center;
            gap: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="brand-container">
            <h1 class="mafia-title">Mafia Club</h1>
        </div>
        <div class="room-header-controls">
            <button class="btn" id="btnSettings" onclick="openRoomSettings()" style="display: none;">⚙️ Настройки</button>
            <button class="btn" onclick="leaveRoom()">Выйти из стола</button>
        </div>
    </header>

    <div class="host-panel" id="hostPanel" style="display: none;">
        <span class="host-badge">👑 Вы создатель стола</span>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-danger" id="btnStartGame" onclick="toggleGameStart()">Запустить игру</button>
        </div>
    </div>

    <div class="game-status-panel">
        <div class="phase-title" id="phaseTitle">Ожидание игроков</div>
        <div class="timer-display" id="timerDisplay">00:00</div>
        <div class="current-speaker" id="speakerInfo">Ожидание старта...</div>
    </div>

    <div class="table-grid" id="tableGrid"></div>

    <div class="chat-panel">
        <div class="chat-messages" id="chatMessages">
            <div class="chat-msg system">Система: Добро пожаловать за стол!</div>
        </div>
        <div class="chat-input-row">
            <input type="text" id="chatInput" placeholder="Написать сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button class="btn" onclick="sendMessage()">Отправить</button>
        </div>
    </div>
</div>

<!-- Подключение общего модуля настроек -->
<script src="settings.js"></script>

<script>
    const currentUser = JSON.parse(localStorage.getItem('mafia_user')) || { nickname: 'Игрок_1' };
    
    let isHost = true;
    let isGameRunning = false;

    function initRoom() {
        if (isHost) {
            document.getElementById('hostPanel').style.display = 'flex';
            document.getElementById('btnSettings').style.display = 'inline-block';
        }

        renderTable();
    }

    // Вызов общего окна настроек при клике
    function openRoomSettings() {
        RoomSettings.open(function(updatedData) {
            // Колбэк-функция: вызывается при сохранении
            renderTable();
        });
    }

    function renderTable() {
        const grid = document.getElementById('tableGrid');
        grid.innerHTML = '';

        for (let i = 1; i <= RoomSettings.data.playersCount; i++) {
            const card = document.createElement('div');
            card.className = 'player-card' + (i === 1 && isGameRunning ? ' active-speaker' : '');
            
            let pName = 'Свободно';
            let pRole = 'Ожидание';
            let isOccupied = false;

            if (i === 1) {
                pName = currentUser.nickname + ' (Создатель)';
                pRole = 'Мирный житель';
                isOccupied = true;
            } else if (i === 2) {
                pName = 'Игрок_2';
                pRole = 'Мирный житель';
                isOccupied = true;
            }

            card.innerHTML = `
                <div class="player-number">${i}</div>
                ${isHost && isOccupied && i !== 1 ? `<button class="kick-btn" style="display:block;" onclick="kickPlayer(${i})" title="Исключить игрока">✖</button>` : ''}
                <div class="avatar-placeholder">${isOccupied ? '👤' : '➕'}</div>
                <div class="player-name">${pName}</div>
                <div class="player-role">${pRole}</div>
            `;

            grid.appendChild(card);
        }
    }

    function kickPlayer(slotIndex) {
        alert('Игрок на слоте #' + slotIndex + ' исключен из комнаты.');
        renderTable();
    }

    function toggleGameStart() {
        const btn = document.getElementById('btnStartGame');
        if (!isGameRunning) {
            isGameRunning = true;
            btn.textContent = 'Остановить игру';
            document.getElementById('phaseTitle').textContent = 'День 1 — Выступление игроков';
            document.getElementById('speakerInfo').textContent = 'Говорит Слот #1';
            document.getElementById('timerDisplay').textContent = `00:${RoomSettings.data.speechTime}`;
        } else {
            isGameRunning = false;
            btn.textContent = 'Запустить игру';
            document.getElementById('phaseTitle').textContent = 'Ожидание игроков';
            document.getElementById('speakerInfo').textContent = 'Ожидание старта...';
            document.getElementById('timerDisplay').textContent = '00:00';
        }
        renderTable();
    }

    function leaveRoom() {
        window.location.href = 'lobby.html';
    }

    function sendMessage() {
        const input = document.getElementById('chatInput');
        if (input.value.trim() !== '') {
            const chatMessages = document.getElementById('chatMessages');
            const msg = document.createElement('div');
            msg.className = 'chat-msg';
            msg.innerHTML = `<span class="author">${currentUser.nickname}:</span> ${input.value}`;
            chatMessages.appendChild(msg);
            input.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    }

    initRoom();
</script>

</body>
</html>
