<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mafia Online - Профиль</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
    <!-- Шапка сайта -->
    <header>
        <h1 class="dancing-title">
            <span class="char c-1">М</span>
            <span class="char c-2 has-hat">А</span>
            <span class="char c-3 has-tie">Ф</span>
            <span class="char c-4 has-glasses">И</span>
            <span class="char c-5">Я</span>
            <span style="width: 5px;"></span>
            <span class="char c-6 has-cigar">К</span>
            <span class="char c-7">Л</span>
            <span class="char c-8">У</span>
            <span class="char c-9 has-rose">Б</span>
        </h1>
        <div id="user-block">
            <button onclick="window.location.href='/'">Назад в клуб</button>
        </div>
    </header>

    <hr>

    <!-- Основной контент профиля -->
    <main>
        <section>
            <div class="section-title">
                <span>👤 Личное дело игрока</span>
            </div>
            
            <div style="background: rgba(255, 255, 255, 0.05); padding: 20px; border-radius: 8px; margin-top: 15px;">
                <p style="margin-bottom: 10px;"><strong>ID в системе:</strong> <span id="profile-id" style="color: #1dd1a1;">загрузка...</span></p>
                <p style="margin-bottom: 10px;"><strong>Позывной (Логин):</strong> <span id="profile-username" style="color: #ff6b6b;">загрузка...</span></p>
                <p style="margin-bottom: 0;"><strong>Общак (Баланс):</strong> <span id="profile-balance">0</span> 💰</p>
            </div>
        </section>

        <!-- Кнопка администратора (скрыта по умолчанию) -->
        <button id="admin-panel-btn" 
                onclick="window.location.href='/admin.html'" 
                style="display: none; width: 100%; margin-top: 20px; background: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%); color: #ffffff; padding: 12px; font-size: 14px; font-weight: bold; border-radius: 12px; border: none; box-shadow: 0 4px 12px rgba(255, 71, 87, 0.4); cursor: pointer;">
            🎩 Панель владельца
        </button>

        <!-- Блок инвентаря -->
        <section style="margin-top: 20px;">
            <div class="section-title">
                <span>🎒 Инвентарь</span>
            </div>
            <div style="background: rgba(255, 255, 255, 0.05); padding: 20px; border-radius: 8px; margin-top: 15px;">
                <p style="margin-bottom: 0;">
                    <strong>🎴 Карточки выбора роли:</strong> 
                    <span id="profile-role-cards" style="color: #feca57; font-weight: bold; font-size: 1.1em;">0</span> шт.
                </p>
            </div>
        </section>

        <!-- Блок под будущие достижения -->
        <section style="margin-top: 20px;">
            <div class="section-title">
                <span>🏆 Награды и медали</span>
            </div>
            <div style="background: rgba(255, 255, 255, 0.05); padding: 20px; border-radius: 8px; margin-top: 15px; color: #a4b0be; text-align: center;">
                Здесь пока пусто. Славные дела еще впереди!
            </div>
        </section>
    </main>
</div>

<!-- Скрипт загрузки данных профиля -->
<script src="profile.js"></script>
</body>
</html>
