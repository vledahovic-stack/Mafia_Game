<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель владельца</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app">
    <header>
        <h3 class="section-title" style="margin: 0;">🎩 Панель владельца</h3>
        <button onclick="window.location.href='/profile.html'" style="width: auto; padding: 6px 12px; margin: 0; background-color: #34385a; border: 1px solid #4a507a;">Назад</button>
    </header>
    <hr>

    <div class="form-group">
        <label for="admin-user-id">ID пользователя:</label>
        <input type="number" id="admin-user-id" placeholder="Введите ID">
    </div>

    <div class="form-group">
        <label for="admin-amount">Сумма начисления:</label>
        <input type="number" id="admin-amount" placeholder="Введите сумму">
    </div>

    <button onclick="addBalance()">Начислить валюту</button>

    <hr style="margin: 20px 0;">

    <h3 style="margin-bottom: 15px;">🎁 Настройка приветственного сундука</h3>

    <div class="form-group" style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
        <input type="checkbox" id="welcome-coins-enabled" checked style="width: auto; margin: 0;">
        <label for="welcome-coins-enabled" style="margin: 0;">Монеты:</label>
        <input type="number" id="welcome-coins-qty" value="500" min="0" style="width: 100px; margin-left: auto;">
    </div>

    <div class="form-group" style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
        <input type="checkbox" id="welcome-role_card-enabled" style="width: auto; margin: 0;">
        <label for="welcome-role_card-enabled" style="margin: 0;">Карточка выбора роли:</label>
        <input type="number" id="welcome-role_card-qty" value="1" min="1" style="width: 100px; margin-left: auto;">
    </div>

    <div class="form-group" style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
        <input type="checkbox" id="welcome-chest_bronze-enabled" checked style="width: auto; margin: 0;">
        <label for="welcome-chest_bronze-enabled" style="margin: 0;">Бронзовый сундук:</label>
        <input type="number" id="welcome-chest_bronze-qty" value="1" min="1" style="width: 100px; margin-left: auto;">
    </div>

    <div class="form-group" style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
        <input type="checkbox" id="welcome-chest_silver-enabled" checked style="width: auto; margin: 0;">
        <label for="welcome-chest_silver-enabled" style="margin: 0;">Серебряный сундук:</label>
        <input type="number" id="welcome-chest_silver-qty" value="1" min="1" style="width: 100px; margin-left: auto;">
    </div>

    <div class="form-group" style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
        <input type="checkbox" id="welcome-chest_gold-enabled" checked style="width: auto; margin: 0;">
        <label for="welcome-chest_gold-enabled" style="margin: 0;">Золотой сундук:</label>
        <input type="number" id="welcome-chest_gold-qty" value="1" min="1" style="width: 100px; margin-left: auto;">
    </div>

    <button id="btn-save-welcome-chest" style="margin-top: 15px;">Сохранить настройки сундука</button>
	
	<div class="admin-card" style="margin-top: 20px; padding: 20px; border: 1px solid #ddd; border-radius: 8px;">
    <h3>Управление кастомным сундуком (рассылка / выдача)</h3>
    <p style="color: #666; font-size: 14px;">Настройте содержимое сундука аналогично приветственному, затем укажите ID игрока или оставьте поле пустым для отправки всем.</p>

    <!-- Монеты -->
    <div class="form-group" style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
        <input type="checkbox" id="custom-coins-enabled" checked style="width: auto; margin: 0;">
        <label for="custom-coins-enabled" style="margin: 0;">Монеты:</label>
        <input type="number" id="custom-coins-qty" value="100" min="1" style="width: 100px; margin-left: auto;">
    </div>

    <!-- Карточка роли -->
    <div class="form-group" style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
        <input type="checkbox" id="custom-role_card-enabled" checked style="width: auto; margin: 0;">
        <label for="custom-role_card-enabled" style="margin: 0;">Карточка выбора роли:</label>
        <input type="number" id="custom-role_card-qty" value="1" min="1" style="width: 100px; margin-left: auto;">
    </div>

    <!-- Бронзовый сундук -->
    <div class="form-group" style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
        <input type="checkbox" id="custom-chest_bronze-enabled" checked style="width: auto; margin: 0;">
        <label for="custom-chest_bronze-enabled" style="margin: 0;">Бронзовый сундук:</label>
        <input type="number" id="custom-chest_bronze-qty" value="1" min="1" style="width: 100px; margin-left: auto;">
    </div>

    <!-- Серебряный сундук -->
    <div class="form-group" style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
        <input type="checkbox" id="custom-chest_silver-enabled" checked style="width: auto; margin: 0;">
        <label for="custom-chest_silver-enabled" style="margin: 0;">Серебряный сундук:</label>
        <input type="number" id="custom-chest_silver-qty" value="1" min="1" style="width: 100px; margin-left: auto;">
    </div>

    <!-- Золотой сундук -->
    <div class="form-group" style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
        <input type="checkbox" id="custom-chest_gold-enabled" checked style="width: auto; margin: 0;">
        <label for="custom-chest_gold-enabled" style="margin: 0;">Золотой сундук:</label>
        <input type="number" id="custom-chest_gold-qty" value="1" min="1" style="width: 100px; margin-left: auto;">
    </div>

    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

    <!-- Выбор получателя и кнопка отправки -->
    <div style="display: flex; gap: 10px; align-items: center;">
        <input type="text" id="custom-target-userid" placeholder="ID игрока (оставьте пустым для всех)" style="flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
        <button id="btn-send-custom-chest" style="padding: 9px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Отправить сундук</button>
    </div>
</div>

    <script src="admin.js"></script>
</body>
</html>
