<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
        <h1 class="dancing-title">
            <span class="char c-1">М</span>
            <span class="char c-2 has-hat">А</span>
            <span class="char c-3 has-tie">Ф</span>
            <span class="char c-4 has-glasses">И</span>
            <span class="char c-5">Я</span>
            <span style="width: 5px;"></span>
            <span class="char c-6 has-cigar">К</span>
            <span class="char c-7">Л</span>
            <span class="char c-8">У</span>
            <span class="char c-9 has-rose">Б</span>
        </h1>
            <button id="back-btn" onclick="window.location.href='index.html'">Назад в клуб</button>
        </header>

        <hr>

        <div class="section-title balance-container">
            <span>Баланс:</span>
            <span id="user-name"><span id="coins-count">0</span> 🪙</span>
        </div>

        <div class="single-card-wrapper">
            <!-- Карточка выбора роли -->
            <div class="role-card-item sheriff compact">
                <div class="role-icon">🃏</div>
                <div class="role-name">Карточка выбора роли</div>
                <div class="role-desc">Позволяет выбрать желаемую роль. Цена: 500 монет</div>
                
                <div class="buy-action-box">
                    <input type="number" id="role_card_qty" class="buy-quantity-input" value="1" min="1" max="99">
                    <button onclick="buyItem('role_card', document.getElementById('role_card_qty').value)">Купить</button>
                </div>
            </div>

            <!-- Сундук -->
            <!-- Бронзовый сундук -->
<div class="role-card-item compact chest-bronze">
    <div class="role-icon">🥉</div>
    <div class="role-name">Бронзовый сундук</div>
    <div class="role-desc">Базовые награды. Цена: 100 монет</div>
    <div class="buy-action-box">
        <input type="number" id="chest_bronze_qty" class="buy-quantity-input" value="1" min="1" max="99">
        <button onclick="buyItem('chest_bronze', document.getElementById('chest_bronze_qty').value)">Купить</button>
    </div>
</div>

<!-- Серебряный сундук -->
<div class="role-card-item compact chest-silver">
    <div class="role-icon">🥈</div>
    <div class="role-name">Серебряный сундук</div>
    <div class="role-desc">Улучшенные награды. Цена: 250 монет</div>
    <div class="buy-action-box">
        <input type="number" id="chest_silver_qty" class="buy-quantity-input" value="1" min="1" max="99">
        <button onclick="buyItem('chest_silver', document.getElementById('chest_silver_qty').value)">Купить</button>
    </div>
</div>

<!-- Золотой сундук -->
<div class="role-card-item compact chest-gold">
    <div class="role-icon">🥇</div>
    <div class="role-name">Золотой сундук</div>
    <div class="role-desc">Ценные награды и редкие карточки. Цена: 500 монет</div>
    <div class="buy-action-box">
        <input type="number" id="chest_gold_qty" class="buy-quantity-input" value="1" min="1" max="99">
        <button onclick="buyItem('chest_gold', document.getElementById('chest_gold_qty').value)">Купить</button>
    </div>
</div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="shop.js"></script>
</body>
</html>
